async function buildComplexMove(card,kind){
  const me=G.players[G.turn],meIdx=G.turn;
  const others=G.players.map((p,i)=>({p,i})).filter(o=>o.i!==meIdx);
  if(kind==="__dual"){
    const opts=(card.colors==="all"?CD.COLOR_KEYS:card.colors).map(c=>({label:C[c].name,swatch:C[c].hex,
      sub:CD.bestHave(me,c)+"/"+C[c].size+" toward next set \u00b7 rent "+C[c].rent.map(r=>"$"+r).join("/"),val:c}));
    const col=await pickList("Play as which color?",null,opts,cardEl(card));
    return col?{t:"prop",cid:card.id,color:col}:null;
  }
  if(kind==="__swipe"){
    const items=[];
    for(const o of others)for(const e of CD.stealableCards(o.p))
      items.push({label:e.card.label,sub:o.p.name+" — "+C[CD.baseColor(e.color)].name,swatch:C[CD.baseColor(e.color)].hex,val:{t:"swipe",cid:card.id,target:o.i,theirCid:e.card.id}});
    if(!items.length){toast("No stealable cards — full sets are protected.");return null;}
    return await pickList("Steal which card?","Cards in completed sets can't be taken.",items);
  }
  if(kind==="__swap"){
    const myItems=[];
    for(const col of Object.keys(me.piles)){ if(CD.isComplete(me,col))continue;
      for(const c of me.piles[col].cards)myItems.push({label:c.label,sub:"Give away — "+C[CD.baseColor(col)].name,swatch:C[CD.baseColor(col)].hex,val:c.id}); }
    if(!myItems.length){toast("You need a color card outside a full set to trade away.");return null;}
    const myCid=await pickList("Trade away which card?",null,myItems);
    if(myCid==null)return null;
    const items=[];
    for(const o of others)for(const e of CD.stealableCards(o.p))
      items.push({label:e.card.label,sub:o.p.name+" — "+C[CD.baseColor(e.color)].name,swatch:C[CD.baseColor(e.color)].hex,val:{t:"swap",cid:card.id,target:o.i,theirCid:e.card.id,myCid}});
    if(!items.length){toast("No cards available to take.");return null;}
    return await pickList("Take which card?",null,items);
  }
  if(kind==="__robber"){
    const items=[];
    for(const o of others)for(const col of Object.keys(o.p.piles))if(CD.isComplete(o.p,col))
      items.push({label:C[CD.baseColor(col)].name+" set ("+o.p.piles[col].cards.length+" cards)",sub:o.p.name+(o.p.piles[col].studio?" +House":"")+(o.p.piles[col].gallery?" +Hotel":""),swatch:C[CD.baseColor(col)].hex,val:{t:"robber",cid:card.id,target:o.i,color:col}});
    if(!items.length){toast("Nobody has a completed set to rob yet.");return null;}
    return await pickList("Rob which set?","You take the whole set, buildings included.",items);
  }
  if(kind==="__debt"){
    const items=others.map(o=>({label:o.p.name,sub:"Assets "+fmtM(CD.assetsTotal(o.p)),val:{t:"debt",cid:card.id,target:o.i}}));
    return await pickList("Who owes you $5M?",null,items);
  }
  if(kind==="__build"){
    const tg=CD.buildTargets(me,card.action);
    if(!tg.length){toast(card.action==="studio"?"Needs a completed set (not Black or Gray).":"Needs a full set that already has a House.");return null;}
    const col=await pickList("Add to which set?",null,tg.map(c=>({label:C[CD.baseColor(c)].name,swatch:C[CD.baseColor(c)].hex,val:c})));
    return col?{t:"build",cid:card.id,color:col}:null;
  }
  if(kind==="__tax"){
    const cols=CD.validTaxColors(G,me,card);
    if(!cols.length){toast(card.action==="wildtax"?"You have no swatches on the board yet.":"You don't own either of this card's colors.");return null;}
    const col=await pickList("Charge rent for which color?",null,
      cols.map(c=>({label:C[c].name,swatch:C[c].hex,sub:"Charges "+fmtM(CD.rentForColor(me,c))+" now \u00b7 ladder "+C[c].rent.map(r=>"$"+r).join("/"),val:c})));
    if(!col)return null;
    const mv={t:"tax",cid:card.id,color:col};
    if(card.action==="wildtax"){
      const t=await pickList("Charge which player?",null,others.map(o=>({label:o.p.name,sub:"Assets "+fmtM(CD.assetsTotal(o.p)),val:o.i})));
      if(t==null)return null; mv.target=t;
    }
    const dtrs=me.hand.filter(x=>x.kind==="action"&&x.action==="dtr");
    const base=CD.rentForColor(me,col);
    if(dtrs.length&&G.actions>=2){
      const items=[{label:"No boost \u2014 charge "+fmtM(base),val:0}];
      items.push({label:"Double the Rainbow \u00d72 \u2014 charge "+fmtM(base*2),sub:"Uses 1 card \u00b7 1 extra action",val:1});
      if(dtrs.length>=2&&G.actions>=3)
        items.push({label:"Quadruple \u00d74 \u2014 charge "+fmtM(base*4),sub:"Stacks both cards \u00b7 2 extra actions",val:2});
      const n=await pickList("Boost this rent?",null,items);
      if(n==null)return null;
      if(n>0)mv.dtrCids=dtrs.slice(0,n).map(x=>x.id);
    }
    return mv;
  }
  return null;
}
async function pileTapped(col){

function statKey(p){return p.name+(p.ai?" (AI)":"");}
function recordStats(){
  const all=store.get("stats",{});
  const anyAI=G.players.some(p=>p.ai);
  if(anyAI){
    const meta=all.__meta||(all.__meta={games:0,diffSum:0});
    meta.games++; meta.diffSum+=G.diffLevel||10;
  }
  G.players.forEach((p,i)=>{
    const e=all[statKey(p)]||(all[statKey(p)]={games:0,wins:0,sets:0,steals:0,blocks:0,collected:0});
    e.games++; if(p===G.winner)e.wins++;
    e.sets+=CD.completedSets(p);
    e.steals+=G.stats[i].steals; e.blocks+=G.stats[i].blocks; e.collected+=G.stats[i].collected;
    if(!p.ai && anyAI){
      e.byDiff=e.byDiff||{};
      const d=e.byDiff[G.diffLevel]||(e.byDiff[G.diffLevel]={g:0,w:0});
      d.g++; if(p===G.winner)d.w++;
    }
  });
  store.set("stats",all);
}
function statsSheet(){
  const all=store.get("stats",{});

    body.appendChild(el("div","statrow head","<b>PLAYER</b><span>W\u2013L</span><span>SETS</span><span>STEAL</span><span>BLOCK</span><span>$</span>"));

async function startGame(){

  const firstGame=(lastWinnerIdx==null||lastWinnerIdx>=players.length);
  const startIdx=firstGame?Math.floor(Math.random()*players.length):(lastWinnerIdx+1)%players.length;
  humanCount=players.filter(p=>!p.ai).length; deviceHolder=-1;
  anchorIdx=players.findIndex(p=>!p.ai); if(anchorIdx<0)anchorIdx=0; topShownIdx=null;
  const providers=[];
  G=CD.newGame({players,winTarget:setup.winTarget,providers,startIdx,
    hooks:{
      log:(m)=>{renderAll();},
      update:async()=>{renderAll();},
      delay:(ms)=>new Promise(r=>setTimeout(r,window.__CD_FAST?0:ms)),
      flash:async(p,card,mv)=>{ renderAll(); if(!p.ai)return; await animateAIPlay(p,card,mv); },
      drew:async(p,n)=>{ renderAll(); await animateDraw(p,n); },
      stealPreview:async(actor,card,tgt,ctx,mv)=>{
        renderAll(); if(window.__CD_FAST)return;
        await new Promise(res=>{
          const ov=el("div","overlay center");ov.style.pointerEvents="none";
          const w=el("div","flashwrap");
          const cap=el("div","flycap");
          cap.appendChild(avatarEl(actor,26));
          const content=el("div","stealrow");
          let txt;
          if(ctx.type==="robber"){
            txt=actor.name+" wants to steal "+tgt.name+"'s whole set!";
            const pl=tgt.piles[ctx.color];
            if(pl){for(const c2 of pl.cards)content.appendChild(cardEl(c2,{small:true}));}
          }else if(ctx.type==="swap"){
            txt=actor.name+" wants to trade for "+tgt.name+"'s card:";
            if(ctx.card)content.appendChild(cardEl(ctx.card));
          }else{
            txt=actor.name+" wants to steal "+tgt.name+"'s card:";
            if(ctx.card)content.appendChild(cardEl(ctx.card));
          }
          cap.appendChild(el("span",null,txt));
          w.append(cap,content);
          ov.appendChild(w);modalroot.appendChild(ov);sfx.bad();
          setTimeout(()=>{ov.remove();res();},1750);
        });
      },
      beforeTurn:async(p)=>{renderAll();if(p.ai&&!window.__CD_FAST){toast(p.name+"'s turn");await new Promise(r=>setTimeout(r,1500));}},
    }});
  G.diffLevel=setup.diff||10;
  G.players.forEach((p,i)=>providers.push(p.ai?CD.makeAI(G.diffLevel):makeHuman(i)));
  show("game");renderAll();
  if(firstGame) await coinFlip(G.players[startIdx]);
  else toast(G.players[startIdx].name+" goes first.");
  sfx.draw();
  G.log.push("Color Deals v"+CD_VERSION);
  let errStreak=0;
  while(!G.winner){
    try{
      await CD.runTurn(G);
      errStreak=0;
    }catch(err){
      errStreak++;
      const msg="\u26a0\ufe0f Error: "+(err&&err.message||err)+" [v"+CD_VERSION+"]";
      G.log.push(msg); console.error("Color Deals turn error:",err);
      if(window.__CD_DEBUG)window.__CD_DEBUG.errors.push("turn: "+msg);
      toast(msg,4000); sfx.bad();
      pendingMoveResolve=null;
      document.querySelectorAll(".overlay").forEach(o=>o.remove());
      if(errStreak>=3){ toast("Repeated errors \u2014 returning to menu.",4000); G=null; show("title"); return; }
      G.actions=0; G.turn=(G.turn+1)%G.players.length; // skip the broken turn, keep playing
      renderAll();
    }
    if(G&&G.winner)break;
    if(!G)return;
  }
  showWin();
}
function showWin(){
  sfx.win();
  const w=G.winner;
  lastWinnerIdx=G.players.indexOf(w);
  recordStats();
  const body=el("div",null,'<div style="font-size:56px;">🏆</div>');
  const ov=el("div","overlay center");ov.id="winov";
  const sh=el("div","sheet");
  sh.appendChild(avatarEl(w,64));
  sh.appendChild(el("div","w-title",w.name+" wins!"));
  sh.appendChild(el("div","s-sub",CD.completedSets(w)+" completed sets · "+G.turnCount+" turns"+(G.players.some(p=>p.ai)?" · AI level "+G.diffLevel:"")));
  const gs=el("div","s-list");
  G.players.forEach((p,i)=>{
    gs.appendChild(el("div","statrow","<b>"+p.name+"</b><span>"+CD.completedSets(p)+" sets</span><span>"+G.stats[i].steals+" st</span><span>"+G.stats[i].blocks+" bl</span><span>$"+G.stats[i].collected+"M</span>"));
  });
  sh.appendChild(gs);
  const again=el("button","btn primary","Play again");
  again.addEventListener("click",()=>{ov.remove();startGame();});
  const home=el("button","btn ghost","Main menu");
  home.addEventListener("click",()=>{ov.remove();G=null;show("title");});
  const foot=el("div","s-foot");foot.append(home,again);
  sh.append(body,foot);
  // reorder: title, sub, trophy handled simply
  ov.appendChild(sh);modalroot.appendChild(ov);
}
$("#btn-start").addEventListener("click",()=>{sfx.tap();startGame();});
$("#btn-quit").addEventListener("click",async()=>{
  const v=await sheet({title:"Quit game?",center:true,sub:"The current game will be lost.",
    buttons:[{label:"Keep playing",cls:"ghost",val:false},{label:"Quit",cls:"danger",val:true}]});
  if(v){G=null;pendingMoveResolve=null;show("title");}
});
function openLog(){
  const rows=G?G.log.slice().reverse().map(m=>{
    const isTurn=m.startsWith("\u2014");
    return '<div class="'+(isTurn?"logturn":"logline")+'">'+m+"</div>";
  }).join(""):"";
  const body=el("div","logfull",rows||'<div class="logline">Nothing yet.</div>');
  sheet({title:"Game log \ud83d\udcdc",sub:"Every play and action this game, newest first.",
    body,buttons:[{label:"Close",cls:"ghost",val:null}]});
}
$("#btn-log").addEventListener("click",()=>{sfx.tap();openLog();});
$("#ticker").addEventListener("click",()=>{if(G){sfx.tap();openLog();}});
function showRules(){
  const body=el("div","rulesbody",
    "<div><b>Goal:</b> complete "+(setup.winTarget||3)+" full color sets on your board before anyone else.</div>"+
    "<div><b>Your turn:</b> draw 2 cards (5 if your hand is empty), then take up to 3 actions — your turn only ends when you tap End Turn, and you can end early with actions to spare. Playing any card — money to your bank, a swatch to your board, or an action card — costs 1 action. Flipping a dual swatch to its other color is FREE and can be done any time on your turn.</div>"+
    "<div><b>Rent:</b> charges every player based on your swatches of that color (Wild Rent charges one player of your choice). Add Double the Rainbow to double it \u2014 or stack both copies on one rent to quadruple it. House (+$3M) and Hotel (+$4M) boost rent on full sets — not on Black or Gray.</div>"+
    "<div><b>Paying:</b> only with cards on the table (bank + board), never from your hand. No change is given. Color cards you pay with join the other player's board.</div>"+
    "<div><b>Just Say No</b> cancels an action played against you — and can be cancelled right back.</div>"+
    "<div><b>Extra colors:</b> once a set is complete, playing more of that color starts a brand-new set of the same color — each finished set counts toward your win total (you can still flip your own wild out of a finished set — but it un-completes it).</div><div><b>Protection:</b> cards in completed sets can't be swiped or traded away — but Steal Set takes a whole completed set.</div>"+
    "<div><b>End of turn:</b> discard down to 7 cards.</div>"+
    "<div><b>Reading cards:</b> tap any card in your hand while waiting (or choose View card up close on your turn) to zoom in and read it. The discard pile and board views are tappable too.</div>");
  sheet({title:"How to play",body,buttons:[{label:"Got it",cls:"primary",val:null}]});
}
})();
</script>
